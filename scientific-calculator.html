<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>NeonCalc — Scientific</title>
<style>
  :root {
    --bg: #05070a;
    --panel: #0f1724;
    --border: #1e2a3a;
    --neon-cyan: #00f3ff;
    --neon-pink: #ff00ff;
    --neon-purple: #bc13fe;
    --text: #e2e8f0;
    --dim: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(12, 74, 110, 0.35) 0%, transparent 45%),
      linear-gradient(rgba(18, 16, 53, 0.6) 50%, transparent 0%);
    pointer-events: none;
    z-index: -1;
  }
  .scanlines {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
  }
  header {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0,243,255,0.6), 0 0 25px rgba(0,243,255,0.2);
  }
  .pulse {
    width: 8px;
    height: 8px;
    background: var(--neon-pink);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--neon-pink);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.6;transform:scale(1);} 50%{opacity:1;transform:scale(1.25);} }
  .mode-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .mode-btn {
    padding: 5px 16px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 36, 0.8);
    color: var(--dim);
    border-radius: 6px;
    font-size: 0.8rem;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 0.1em;
  }
  .mode-btn.active {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 14px rgba(0,243,255,0.35);
  }
  .calc {
    background: rgba(15, 23, 36, 0.92);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 16px 16px;
    gap: 9px;
    width: min(410px, 100%);
    max-width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,243,255,0.06);
    backdrop-filter: blur(12px);
  }
  .display {
    grid-column: 1 / -1;
    background: #05070a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: right;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.6);
  }
  .prev {
    font-size: 0.8rem;
    color: var(--dim);
    min-height: 1.1em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .curr {
    font-size: 2.1rem;
    font-variant-numeric: tabular-nums;
    color: var(--neon-cyan);
    text-shadow: 0 0 14px rgba(0,243,255,0.55);
    min-height: 1.1em;
    word-break: break-all;
  }
  button {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(30, 42, 58, 0.7);
    color: var(--text);
    font-size: 0.95rem;
    padding: 15px 7px;
    cursor: pointer;
    outline: none;
    transition: all 0.12s;
    font-family: inherit;
  }
  button:active { transform: scale(0.95); border-color: var(--neon-cyan); }
  button:hover { background: rgba(42, 58, 78, 0.8); }
  button.op { color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,255,0.15); }
  button.op:active { border-color: var(--neon-pink); box-shadow: 0 0 16px rgba(255,0,255,0.45); background: rgba(55, 10, 55, 0.7); }
  button.fn { color: var(--neon-purple); box-shadow: 0 0 10px rgba(188,19,254,0.15); }
  button.fn:active { border-color: var(--neon-purple); box-shadow: 0 0 16px rgba(188,19,254,0.45); background: rgba(35, 15, 60, 0.7); }
  .eq {
    grid-column: 5 / 7;
    background: rgba(10, 40, 70, 0.85);
    color: #fff;
    border-color: #1e4a8a;
  }
  .eq:hover { background: rgba(14, 55, 95, 0.9); }
  .eq:active { border-color: var(--neon-cyan); box-shadow: 0 0 18px rgba(0,243,255,0.5); }
  .clear {
    background: rgba(70, 20, 20, 0.75);
    color: #ff6b6b;
    border-color: #4a1a1a;
  }
  .clear:hover { background: rgba(90, 25, 25, 0.85); }
  .clear:active { border-color: #ff6b6b; box-shadow: 0 0 16px rgba(255,107,107,0.5); }
  .mem { font-size: 0.8rem; color: #5eead4; border-color: #14532d; }
  .mem:active { border-color: #5eead4; box-shadow: 0 0 14px rgba(94,234,212,0.45); }
  .toggle { font-size: 0.75rem; padding: 14px 6px; }
  .lbl { font-size: 0.62rem; color: #475569; pointer-events: none; user-select: none; display: block; margin-bottom: 2px; }
  .val { font-size: 0.95rem; }
  .note {
    margin-top: 12px;
    font-size: 0.7rem;
    color: #475569;
    text-align: center;
    max-width: 410px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @media (max-width: 400px) {
    .calc { padding: 13px 10px 11px; gap: 7px; }
    button { padding: 13px 5px; font-size: 0.9rem; }
    .curr { font-size: 1.75rem; }
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<header>
  <div class="pulse"></div>
  <h1>neon<span style="color:var(--neon-pink)">calc</span></h1>
</header>
<div class="mode-row">
  <button class="mode-btn active" id="degBtn" data-mode="deg">DEG</button>
  <button class="mode-btn" id="radBtn" data-mode="rad">RAD</button>
</div>
<div class="calc">
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <button class="mem" data-action="mc"><span class="lbl">memory clear</span><span class="val">MC</span></button>
  <button class="mem" data-action="mr"><span class="lbl">memory recall</span><span class="val">MR</span></button>
  <button class="mem" data-action="mplus"><span class="lbl">memory add</span><span class="val">M+</span></button>
  <button class="mem" data-action="mminus"><span class="lbl">memory sub</span><span class="val">M−</span></button>
  <button class="clear" data-action="clear"><span class="lbl">all clear</span><span class="val">AC</span></button>
  <button class="op" data-action="del"><span class="lbl">delete</span><span class="val">⌫</span></button>

  <button class="fn" data-func="sin">sin</button>
  <button class="fn" data-func="cos">cos</button>
  <button class="fn" data-func="tan">tan</button>
  <button class="fn" data-func="asin">asin</button>
  <button class="fn" data-func="acos">acos</button>
  <button class="fn" data-func="atan">atan</button>

  <button class="fn" data-func="log">log</button>
  <button class="fn" data-func="ln">ln</button>
  <button class="fn" data-func="exp">eˣ</button>
  <button class="fn" data-func="pow">xʸ</button>
  <button class="fn" data-func="sqrt">√</button>
  <button class="fn" data-func="fact">x!</button>

  <button data-value="7">7</button>
  <button data-value="8">8</button>
  <button data-value="9">9</button>
  <button class="op" data-op="/">÷</button>
  <button class="fn" data-func="pi">π</button>
  <button class="fn" data-func="e">e</button>

  <button data-value="4">4</button>
  <button data-value="5">5</button>
  <button data-value="6">6</button>
  <button class="op" data-op="*">×</button>
  <button class="fn" data-func="mod">%</button>
  <button class="fn" data-func="neg">+/-</button>

  <button data-value="1">1</button>
  <button data-value="2">2</button>
  <button data-value="3">3</button>
  <button class="op" data-op="-">−</button>
  <button class="fn" data-func="paren">( )</button>
  <button class="fn" data-func="dot">.</button>

  <button data-value="0">0</button>
  <button class="fn" data-func="dot">.</button>
  <button class="fn" data-func="ans">Ans</button>
  <button class="op" data-op="+">+</button>
  <button class="eq" data-action="equals">=</button>
</div>
<p class="note">digits + - * / . enter = backspace esc</p>

<script>
const prevEl = document.getElementById('prev');
const currEl = document.getElementById('curr');
const degBtn = document.getElementById('degBtn');
const radBtn = document.getElementById('radBtn');

let degMode = true;
let memory = 0;
let current = '0';
let previous = '';
let pendingOp = null;
let awaitingOperand = false;
let lastAnswer = 0;

function format(num) {
  if (num === null || num === undefined || !isFinite(num)) return 'Error';
  const abs = Math.abs(num);
  let str;
  if ((abs < 1e-6 && abs !== 0) || abs >= 1e12) {
    str = num.toExponential(6);
  } else {
    str = num.toString();
  }
  str = str.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1,');
  return str;
}

function updateDisplay() {
  currEl.textContent = current;
  prevEl.textContent = previous;
}

function clearAll() {
  current = '0';
  previous = '';
  pendingOp = null;
  awaitingOperand = false;
  updateDisplay();
}

function deleteLast() {
  if (awaitingOperand) return;
  if (current.length <= 1) {
    current = '0';
  } else {
    current = current.slice(0, -1);
  }
  updateDisplay();
}

function appendChar(ch) {
  if (awaitingOperand) {
    current = ch;
    awaitingOperand = false;
  } else {
    if (current === '0' && ch !== '.') current = ch;
    else current += ch;
  }
  updateDisplay();
}

function appendDot() {
  if (awaitingOperand) {
    current = '0.';
    awaitingOperand = false;
  } else if (!current.includes('.')) {
    current += '.';
  }
  updateDisplay();
}

function applyUnary(fn) {
  const val = parseFloat(current);
  if (!isFinite(val)) return;
  let result;
  try {
    switch (fn) {
      case 'sin': result = Math.sin(degMode ? val * Math.PI / 180 : val); break;
      case 'cos': result = Math.cos(degMode ? val * Math.PI / 180 : val); break;
      case 'tan': result = Math.tan(degMode ? val * Math.PI / 180 : val); break;
      case 'asin': result = Math.asin(val); result = degMode ? result * 180 / Math.PI : result; break;
      case 'acos': result = Math.acos(val); result = degMode ? result * 180 / Math.PI : result; break;
      case 'atan': result = Math.atan(val); result = degMode ? result * 180 / Math.PI : result; break;
      case 'log': result = Math.log10(val); break;
      case 'ln': result = Math.log(val); break;
      case 'exp': result = Math.exp(val); break;
      case 'sqrt': result = Math.sqrt(val); break;
      case 'fact': result = factorial(Math.round(val)); break;
      case 'pi': result = Math.PI; break;
      case 'e': result = Math.E; break;
      case 'mod': result = val % 100; break;
      case 'neg': result = -val; break;
      case 'dot': appendDot(); return;
      case 'paren': return;
      case 'ans': result = lastAnswer; break;
    }
  } catch {
    current = 'Error';
    updateDisplay();
    return;
  }
  if (!isFinite(result)) { current = 'Error'; }
  else {
    current = normalize(result);
    if (fn === 'pi' || fn === 'e') awaitingOperand = true;
  }
  previous = '';
  pendingOp = null;
  updateDisplay();
}

function factorial(n) {
  if (n < 0 || !Number.isInteger(n)) return NaN;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function normalize(num) {
  if (Math.abs(num) < 1e-10) return 0;
  return Math.round(num * 1e10) / 1e10;
}

function setPendingOp(op) {
  const val = parseFloat(current);
  if (!isFinite(val)) return;
  if (pendingOp && !awaitingOperand) {
    calculate();
  }
  previous = current + ' ' + opSymbol(op);
  pendingOp = op;
  awaitingOperand = true;
}

function opSymbol(op) {
  return { '/': '÷', '*': '×', '-': '−', '+': '+' }[op] || op;
}

function calculate() {
  if (pendingOp === null) return;
  const parts = previous.split(' ');
  const a = parseFloat(parts[0]);
  const b = parseFloat(current);
  if (!isFinite(a) || !isFinite(b)) return;
  let result;
  try {
    switch (pendingOp) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '*': result = a * b; break;
      case '/': result = b === 0 ? NaN : a / b; break;
    }
  } catch {
    current = 'Error';
    updateDisplay();
    return;
  }
  if (!isFinite(result)) {
    current = 'Error';
  } else {
    result = normalize(result);
    lastAnswer = result;
    current = format(result);
  }
  previous = '';
  pendingOp = null;
  awaitingOperand = true;
  updateDisplay();
}

function doEquals() {
  if (pendingOp === null) return;
  calculate();
}

function memAction(action) {
  switch (action) {
    case 'mc': memory = 0; break;
    case 'mr': current = format(memory); awaitingOperand = true; updateDisplay(); return;
    case 'mplus': memory += parseFloat(current) || 0; break;
    case 'mminus': memory -= parseFloat(current) || 0; break;
  }
  previous = '';
  pendingOp = null;
  awaitingOperand = true;
  updateDisplay();
}

function setDeg() { degMode = true; degBtn.classList.add('active'); radBtn.classList.remove('active'); }
function setRad() { degMode = false; radBtn.classList.add('active'); degBtn.classList.remove('active'); }

document.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.value;
    const func = btn.dataset.func;
    const op = btn.dataset.op;
    const action = btn.dataset.action;
    if (val !== undefined) appendChar(val);
    else if (func) applyUnary(func);
    else if (op) setPendingOp(op);
    else if (action === 'equals') doEquals();
    else if (action === 'clear') clearAll();
    else if (action === 'del') deleteLast();
    else if (action) memAction(action);
  });
});

degBtn.addEventListener('click', setDeg);
radBtn.addEventListener('click', setRad);

window.addEventListener('keydown', (e) => {
  if ((e.key >= '0' && e.key <= '9')) appendChar(e.key);
  else if (e.key === '.') appendDot();
  else if (e.key === '+') setPendingOp('+');
  else if (e.key === '-') setPendingOp('-');
  else if (e.key === '*') setPendingOp('*');
  else if (e.key === '/') setPendingOp('/');
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); doEquals(); }
  else if (e.key === 'Backspace') deleteLast();
  else if (e.key === 'Escape') clearAll();
});

updateDisplay();
</script>
</body>
</html>
